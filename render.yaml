services:
  - type: web
    name: penthouse-ak37
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        value: https://jzttfxqfewiljthmqcsb.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        value: sb_publishable_ig0UcH-Sbob-xAYEdnKOKw_Xw-QP5oj
